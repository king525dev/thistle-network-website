<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>The Thistle Network — Under Construction</title>

    <meta http-equiv="refresh" content="3;url=./mocks/index.html" />

    <link rel="stylesheet" href="mocks/link.css">
</head>

<body>
    <main class="page">
        <div class="mark" aria-hidden="true">T</div>

        <p class="eyebrow">The Thistle Network</p>

        <h1>Something <span class="accent">new</span> is growing.</h1>

        <p class="message">
            Our website is currently under construction. In the meantime, you can
            explore our temporary site.
        </p>

        <a class="redirect" href="./mocks/index.html">
            Visit the site
            <span class="arrow" aria-hidden="true">→</span>
        </a>

        <p class="countdown" aria-live="polite">
            Redirecting in <span id="seconds">3</span> seconds…
        </p>

        <div class="rule" aria-hidden="true"></div>
    </main>

    <script>
        let seconds = 3;
        const countdown = document.getElementById("seconds");

        const timer = setInterval(() => {
            seconds -= 1;
            countdown.textContent = seconds;

            if (seconds <= 0) {
                clearInterval(timer);
                window.location.href = "./mocks/index.html";
            }
        }, 1000);
    </script>
</body>

</html>
